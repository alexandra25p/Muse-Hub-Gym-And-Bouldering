<nav class="app-nav">
  <div class="nav-inner">
    <div class="nav-brand">
      <span class="brand-name">MuseHub</span>
      <span class="brand-sep">|</span>
      <span class="brand-sub">Gym & Bouldering</span>
    </div>

    <div class="nav-links">
      <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      <a routerLink="/classes" routerLinkActive="active">Classes</a>
      <a routerLink="/wall" routerLinkActive="active">Wall</a>
      <a routerLink="/journal" routerLinkActive="active">Journal</a>
      <a routerLink="/leaderboard" routerLinkActive="active">Leaderboard</a>
      <a routerLink="/profile" routerLinkActive="active">Profile</a>
      @if (isAdmin()) {
        <a routerLink="/admin" routerLinkActive="active" class="admin-link">Admin</a>
      }
    </div>

    <div class="nav-right">
      <button class="dark-toggle" (click)="darkMode.toggle()" [title]="darkMode.dark() ? 'Light mode' : 'Dark mode'">
        @if (darkMode.dark()) {
          <span nz-icon nzType="sun" nzTheme="outline"></span>
        } @else {
          <span nz-icon nzType="bulb" nzTheme="outline"></span>
        }
      </button>

      @if (userName()) {
        <span class="user-name">{{ userName() }}</span>
      }
      <button nz-button nzSize="small" (click)="logoutClick.emit()">
        <span nz-icon nzType="logout"></span>
        Sign Out
      </button>
    </div>
  </div>
</nav>
